[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recomendation"
version = "0.1.0"
description = "MovieLens recommender system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "requests>=2.31",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "nbconvert>=7.0",
    "jupyter-client>=8.0",
    "ipykernel>=6.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "I", "UP", "BLE", "PIE", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"